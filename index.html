            q: "Osmanlı Devleti'de 'Miri Toprak' türlerinden olan 'Malikane' sisteminin amacı nedir?", 
            a: ["Devlet adamlarına üstün hizmetleri karşılığında ömür boyu toprak verilmesi", "Gelirinin halka dağıtılması", "Sadece asker yetiştirilmesi", "Hazine açıklarının kapatılması", "Dış borç ödenmesi"], 
            correct: 0, 
            reason: "Liyakatli devlet adamlarını ödüllendirmek amacıyla uygulanan bir toprak sistemidir." 
        },
        { 
            y: "2013 - KPSS",
            q: "TBMM'yi tanıyan 'ilk İtilaf devleti' hangisidir?", 
            a: ["Fransa", "İngiltere", "İtalya", "Yunanistan", "Rusya"], 
            correct: 0, 
            reason: "1921 Ankara Antlaşması ile Fransa TBMM'yi resmen tanımıştır." 
        },
        { 
            y: "2012 - KPSS",
            q: "I. Balkan Savaşı sonucunda Osmanlı Devleti'nin kaybettiği yerler arasında hangisi yoktur?", 
            a: ["Edirne", "Selanik", "Girit", "Kırklareli", "Manastır"], 
            correct: 2, 
            reason: "Girit, II. Meşrutiyet ilanı (1908) sırasındaki kargaşada Yunanistan'a katılmıştır; I. Balkan'da değil." 
        },
        { 
            y: "2011 - KPSS",
            q: "Cumhuriyet döneminde 'Harf İnkılabı' (1928) neden yapılmıştır?", 
            a: ["Okuma-yazma oranını artırmak ve eğitimi kolaylaştırmak", "Sadece batıya benzemek için", "Eski kitapları yok etmek için", "Dini eğitimi yasaklamak için", "Yabancı dil öğretmek için"], 
            correct: 0, 
            reason: "Yeni Türk alfabesi, Türkçenin yapısına daha uygun olduğu için okullaşmayı hızlandırmıştır." 
        }
    ];

    let currentIdx = 0;
    let queue = [];
    let errorCount = 0;
    let selectedIdx = null;

    function renderQuestion() {
        if (currentIdx >= questionsList.length) {
            if (queue.length > 0) {
                questionsList.push(queue.shift());
                renderQuestion(); 
            } else {
                document.getElementById('quiz-container').innerHTML = "<div id='video-title-container'><h1 class='video-title'>Sınav Tamamlandı!</h1></div><p style='text-align:center;font-size:1.2rem;color:#1e3a8a;'>Tebrikler, 267 adet çıkmış tarih sorusunu eksiksiz ve yıl bilgileriyle tamamladın.</p>";
            }
            return;
        }
        
        const q = questionsList[currentIdx];
        document.getElementById('year-info').innerText = q.y;
        document.getElementById('question-text').innerText = (currentIdx + 1) + ". " + q.q;
        
        document.getElementById('current-q-count').innerText = (currentIdx + 1);
        document.getElementById('hata-count').innerText = errorCount;

        const optionsDiv = document.getElementById('options-container');
        optionsDiv.innerHTML = '';
        q.a.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
                btn.classList.add('selected');
                selectedIdx = idx;
                document.getElementById('feedback-area').style.display = 'none';
            };
            optionsDiv.appendChild(btn);
        });
        document.getElementById('check-btn').style.display = 'block';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('feedback-area').style.display = 'none';
        selectedIdx = null;
    }

    function checkAnswer() {
        if (selectedIdx === null) return;
        const q = questionsList[currentIdx];
        const feedback = document.getElementById('feedback-area');
        
        if (selectedIdx === q.correct) {
            feedback.innerText = "Doğru! " + q.reason;
            feedback.className = "correct";
        } else {
            errorCount++;
            document.getElementById('hata-count').innerText = errorCount;
            feedback.innerText = "Yanlış! Doğrusu: " + q.a[q.correct] + ". " + q.reason;
            feedback.className = "wrong";
            queue.push(q, q, q); // Spaced Repetition (3 Tekrar)
        }
        
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
        feedback.style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        renderQuestion();
    }

    renderQuestion();
</script>
